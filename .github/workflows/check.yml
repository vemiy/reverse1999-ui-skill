name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check braces and radii
        run: node scripts/check-css.mjs

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
