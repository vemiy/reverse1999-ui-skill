<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="电台电波">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211f"/>
      <stop offset="0.7" stop-color="#0d1514"/>
      <stop offset="1" stop-color="#080c0b"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4f7d6a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#080c0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg3)"/>
  <rect width="600" height="800" fill="url(#glow3)"/>

  <!-- 电波 -->
  <g fill="none" stroke="#8ec7b0" stroke-opacity="0.5">
    <circle cx="300" cy="340" r="46" stroke-opacity="0.85"/>
    <circle cx="300" cy="340" r="92" stroke-opacity="0.6"/>
    <circle cx="300" cy="340" r="140" stroke-opacity="0.42"/>
    <circle cx="300" cy="340" r="190" stroke-opacity="0.28"/>
    <circle cx="300" cy="340" r="244" stroke-opacity="0.18"/>
  </g>

  <!-- 中心 -->
  <circle cx="300" cy="340" r="10" fill="#e9dccd"/>
  <circle cx="300" cy="340" r="22" fill="none" stroke="#c97a2b" stroke-width="1"/>

  <!-- 刻度 -->
  <g stroke="#e9dccd" stroke-opacity="0.3">
    <line x1="60" y1="560" x2="540" y2="560"/>
    <line x1="60" y1="556" x2="60" y2="564"/>
    <line x1="180" y1="556" x2="180" y2="564"/>
    <line x1="300" y1="552" x2="300" y2="568"/>
    <line x1="420" y1="556" x2="420" y2="564"/>
    <line x1="540" y1="556" x2="540" y2="564"/>
  </g>
  <text x="300" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="6" fill="#8ec7b0">88.9</text>

  <!-- 波纹 -->
  <g fill="none" stroke="#b55829" stroke-opacity="0.45">
    <path d="M0 700 Q75 660 150 700 T300 700 T450 700 T600 700"/>
    <path d="M0 730 Q75 700 150 730 T300 730 T450 730 T600 730" stroke-opacity="0.25"/>
  </g>

  <rect width="600" height="800" filter="url(#grain3)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
