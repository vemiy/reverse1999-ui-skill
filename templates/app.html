<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="rust" data-density="compact" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>夜航档案室 · 手机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..700;1,400..600&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/reverse1999.css">
</head>
<body class="r99">

<div class="r99-atmos" aria-hidden="true"></div>
<div class="r99-rain" aria-hidden="true"></div>
<div class="r99-grain" aria-hidden="true"></div>
<div class="r99-vignette" aria-hidden="true"></div>

<div class="r99-app">

  <header class="r99-topbar">
    <a class="r99-logo" href="showcase.html">
      <span class="r99-logo__zh" style="font-size:18px">夜航</span>
      <span class="r99-logo__en">Night Archive</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="r99-btn r99-btn--quiet" style="min-height:36px;padding:4px 8px" data-r99-theme-toggle aria-label="切换明暗">◐</button>
      <button class="r99-btn" style="min-height:36px;padding:6px 12px;font-size:13px" data-r99-open="sheet-filter">筛选</button>
    </div>
  </header>

  <section class="r99-herocard">
    <img src="../assets/art/scene-rain.svg" alt="">
    <div class="r99-herocard__body">
      <span class="r99-kicker r99-kicker--accent">Record of the day</span>
      <h1 class="r99-title" style="font-size:26px;margin-top:8px">钟楼最后一次报时</h1>
      <div class="r99-meta" style="margin-top:10px">
        <span>N-0421</span><span>1999.12.31</span><span class="r99-status r99-status--ok">已归档</span>
      </div>
    </div>
  </section>

  <nav style="display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px" aria-label="分类">
    <button class="r99-chip r99-chip--on" style="white-space:nowrap">全部</button>
    <button class="r99-chip" style="white-space:nowrap">时间</button>
    <button class="r99-chip" style="white-space:nowrap">电台</button>
    <button class="r99-chip" style="white-space:nowrap">建筑</button>
    <button class="r99-chip" style="white-space:nowrap">口述</button>
  </nav>

  <section style="padding:8px 16px 0">
    <div class="r99-plate" style="margin-bottom:8px">
      <span class="r99-plate__no">02</span>
      <span class="r99-plate__text">
        <span class="r99-plate__en">Records</span>
        <span class="r99-h3">最近入档</span>
      </span>
    </div>
    <ul class="r99-list">
      <li><a href="reading.html" style="grid-template-columns:58px minmax(0,1fr) auto;padding:14px 0">
        <span class="r99-row__no">N-0421</span>
        <span class="r99-row__name" style="font-size:15px">钟楼最后一次报时</span>
        <span class="r99-status r99-status--ok">已归档</span>
      </a></li>
      <li><a href="#" style="grid-template-columns:58px minmax(0,1fr) auto;padding:14px 0">
        <span class="r99-row__no">N-0418</span>
        <span class="r99-row__name" style="font-size:15px">东区积水深度记录</span>
        <span class="r99-status r99-status--ok">已归档</span>
      </a></li>
      <li><a href="#" style="grid-template-columns:58px minmax(0,1fr) auto;padding:14px 0">
        <span class="r99-row__no">N-0417</span>
        <span class="r99-row__name" style="font-size:15px">电台深夜频段中断</span>
        <span class="r99-status r99-status--due">待核</span>
      </a></li>
      <li><a href="#" style="grid-template-columns:58px minmax(0,1fr) auto;padding:14px 0">
        <span class="r99-row__no">N-0409</span>
        <span class="r99-row__name" style="font-size:15px">剧院散场口述</span>
        <span class="r99-status r99-status--ok">已归档</span>
      </a></li>
    </ul>
  </section>

  <section style="padding:16px">
    <div class="r99-panel r99-panel--paper">
      <span class="r99-kicker r99-kicker--accent">Reading room</span>
      <h2 class="r99-h3" style="margin-top:6px">预约阅览室</h2>
      <p class="r99-note" style="margin:8px 0 16px">纸本原件只在工作日下午开放。</p>
      <button class="r99-btn r99-btn--primary r99-btn--block" data-r99-toast="已登记，确认邮件稍后寄出">
        登记<span class="r99-btn__en">Register</span>
      </button>
    </div>
  </section>

</div>

<nav class="r99-tabbar" aria-label="底部导航">
  <a href="showcase.html">封面</a>
  <a href="library.html">档案</a>
  <a href="#" aria-current="page">今日</a>
  <a href="#">我的</a>
</nav>

<div class="r99-scrim" id="scrim-sheet" hidden></div>
<div class="r99-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-filter" data-r99-scrim="scrim-sheet" hidden>
  <div class="r99-sheet__grip" aria-hidden="true"></div>
  <span class="r99-kicker">Filter</span>
  <h2 class="r99-h3" id="sheet-title" style="margin-top:6px">筛选</h2>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px">
    <button class="r99-chip r99-chip--on">时间与天气</button>
    <button class="r99-chip">电台与口述</button>
    <button class="r99-chip">建筑与街景</button>
    <button class="r99-chip">已归档</button>
  </div>
  <div class="r99-actions" style="margin:0">
    <button class="r99-btn r99-btn--primary" style="flex:1" data-r99-close data-r99-toast="已应用筛选">应用</button>
    <button class="r99-btn" data-r99-close>取消</button>
  </div>
</div>

<script src="../assets/variant.js"></script>
<script src="../assets/fx.js"></script>
</body>
</html>
